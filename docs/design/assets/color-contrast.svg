<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="850" viewBox="0 0 1600 850"><style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style><rect x="0" y="0" width="1600" height="850" fill="#f6f2e9" stroke="none" rx="0"/><text x="60" y="76" font-size="40" fill="#192536" font-weight="700">색상과 명암</text><text x="60" y="122" font-size="23" fill="#515d6d" font-weight="400">실제 UI 색상과 명암비를 함께 읽는다.</text><rect x="60" y="170" width="320" height="90" fill="#f6f2e9" stroke="#7a7e82" rx="8"/><text x="82" y="227" font-size="28" fill="#192536" font-weight="700">유물 살펴보기</text><text x="420" y="204" font-size="25" fill="#192536" font-weight="700">관찰 본문</text><text x="420" y="242" font-size="21" fill="#515d6d" font-weight="400">#192536 / #F6F2E9</text><text x="900" y="225" font-size="30" fill="#26488c" font-weight="700">13.83:1</text><text x="1120" y="222" font-size="22" fill="#192536" font-weight="400">밝은 바탕에서 글자를 또렷하게</text><rect x="60" y="290" width="320" height="90" fill="#f6f2e9" stroke="#7a7e82" rx="8"/><text x="82" y="347" font-size="28" fill="#515d6d" font-weight="700">유물 살펴보기</text><text x="420" y="324" font-size="25" fill="#192536" font-weight="700">보조 문구</text><text x="420" y="362" font-size="21" fill="#515d6d" font-weight="400">#515D6D / #F6F2E9</text><text x="900" y="345" font-size="30" fill="#26488c" font-weight="700">5.99:1</text><text x="1120" y="342" font-size="22" fill="#192536" font-weight="400">작은 정보도 읽기 대비를 유지</text><rect x="60" y="410" width="320" height="90" fill="#26488c" stroke="#7a7e82" rx="8"/><text x="82" y="467" font-size="28" fill="#ffffff" font-weight="700">유물 살펴보기</text><text x="420" y="444" font-size="25" fill="#192536" font-weight="700">실행 버튼</text><text x="420" y="482" font-size="21" fill="#515d6d" font-weight="400">#FFFFFF / #26488C</text><text x="900" y="465" font-size="30" fill="#26488c" font-weight="700">8.79:1</text><text x="1120" y="462" font-size="22" fill="#192536" font-weight="400">눌러야 할 행동을 분명하게</text><rect x="60" y="530" width="320" height="90" fill="#111b2a" stroke="#7a7e82" rx="8"/><text x="82" y="587" font-size="28" fill="#edcf8b" font-weight="700">유물 살펴보기</text><text x="420" y="564" font-size="25" fill="#192536" font-weight="700">윤곽·번호</text><text x="420" y="602" font-size="21" fill="#515d6d" font-weight="400">#EDCF8B / #111B2A</text><text x="900" y="585" font-size="30" fill="#26488c" font-weight="700">11.45:1</text><text x="1120" y="582" font-size="22" fill="#192536" font-weight="400">어두운 바탕에서 모양을 강조</text><rect x="60" y="650" width="320" height="90" fill="#111b2a" stroke="#7a7e82" rx="8"/><text x="82" y="707" font-size="28" fill="#f6f2e9" font-weight="700">유물 살펴보기</text><text x="420" y="684" font-size="25" fill="#192536" font-weight="700">부위별 해설</text><text x="420" y="722" font-size="21" fill="#515d6d" font-weight="400">#F6F2E9 / #111B2A</text><text x="900" y="705" font-size="30" fill="#26488c" font-weight="700">15.48:1</text><text x="1120" y="702" font-size="22" fill="#192536" font-weight="400">형태를 보며 설명을 읽도록</text><text x="60" y="817" font-size="22" fill="#515d6d" font-weight="400">명암비: WCAG 상대 휘도 공식으로 계산 · 색상 외에도 밑줄, 테두리, 굵기로 상태를 구분한다.</text></svg>