<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style><rect x="0" y="0" width="1600" height="1000" fill="#f6f2e9" stroke="none" rx="0"/><text x="60" y="80" font-size="44" fill="#192536" font-weight="700">사용 색상표</text><text x="60" y="125" font-size="25" fill="#515d6d" font-weight="400">청동 유물의 질감을 유지하고, 조작과 윤곽에 대비를 집중한다.</text><rect x="60" y="180" width="350" height="165" fill="#f6f2e9" stroke="#7a7e82" rx="12"/><text x="60" y="390" font-size="28" fill="#192536" font-weight="700">Paper</text><text x="60" y="432" font-size="23" fill="#515d6d" font-weight="400">#F6F2E9</text><text x="60" y="474" font-size="23" fill="#192536" font-weight="400">기본 바탕</text><rect x="440" y="180" width="350" height="165" fill="#192536" stroke="#7a7e82" rx="12"/><text x="440" y="390" font-size="28" fill="#192536" font-weight="700">Ink</text><text x="440" y="432" font-size="23" fill="#515d6d" font-weight="400">#192536</text><text x="440" y="474" font-size="23" fill="#192536" font-weight="400">기본 글자</text><rect x="820" y="180" width="350" height="165" fill="#26488c" stroke="#7a7e82" rx="12"/><text x="820" y="390" font-size="28" fill="#192536" font-weight="700">Blue</text><text x="820" y="432" font-size="23" fill="#515d6d" font-weight="400">#26488C</text><text x="820" y="474" font-size="23" fill="#192536" font-weight="400">실행 · 포커스</text><rect x="1200" y="180" width="350" height="165" fill="#edcf8b" stroke="#7a7e82" rx="12"/><text x="1200" y="390" font-size="28" fill="#192536" font-weight="700">Gold</text><text x="1200" y="432" font-size="23" fill="#515d6d" font-weight="400">#EDCF8B</text><text x="1200" y="474" font-size="23" fill="#192536" font-weight="400">윤곽 · 활성</text><rect x="60" y="520" width="350" height="165" fill="#111b2a" stroke="#7a7e82" rx="12"/><text x="60" y="730" font-size="28" fill="#192536" font-weight="700">Night</text>