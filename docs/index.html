<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2e9"><title>청동의 울림</title><link rel="stylesheet" href="style.css?v=design-2"></head>
<body><main id="experience" aria-label="청동방울 소리와 진동 체험">
<nav id="top-nav" aria-label="유물 선택과 뷰어 도구"><div id="types" role="group" aria-label="유물 종류"></div><div class="viewer-tools" role="group" aria-label="뷰어 도구"><button id="feel-entry" aria-pressed="false">손끝탐색</button><button id="fullscreen" aria-pressed="false">전체화면</button></div></nav>
<section id="stage" aria-label="3D 유물. 가로로 드래그하여 좌우 회전" tabindex="0"><div id="webgl"></div><button id="asset-loading">불러오는 중…</button><canvas id="feel-canvas" hidden aria-label="유물 윤곽 손끝탐색"></canvas><div id="feel-points" hidden aria-label="주요 부위 설명"></div></section>

<dialog id="activation" aria-labelledby="activation-title"><h2 id="activation-title">흔들어 느끼는 청동방울</h2><button id="start">소리·동작 센서 활성화</button><button id="feel-without-sensors">손끝탐색으로 시작</button><p id="activation-status" role="status" aria-live="polite"></p></dialog>
<section id="feel-panel" hidden aria-label="손끝탐색 안내"><p id="feel-status" role="status"></p><button id="feel-exit">탐색 종료</button></section><div class="signal" aria-label="소리와 진동 패턴"><canvas id="pattern" aria-label="움직임에 반응하는 소리와 진동 패턴"></canvas></div>
<p id="status" role="status" aria-live="polite" hidden></p>
<button id="about" aria-label="출처 정보" title="출처 정보">ⓘ</button>
<dialog id="info" aria-labelledby="info-title"><button id="close-info" aria-label="출처 정보 닫기">×</button><h2 id="info-title">출처</h2><dl class="credits"><dt>3D 모델</dt><dd>국가유산청<br>전 덕산 청동방울 일괄<br><span>공공누리 제1유형 · 웹용 경량화</span></dd><dt>음원</dt><dd>한국저작권위원회 · 공유마당<br>국악기_방울1·3·4·5<br><span>CC BY 4.0 · 발췌 및 음색 편집</span></dd><dt>해설</dt><dd>국가유산청 · 한국민족문화대백과사전<br><span>유물 형태 설명을 짧게 재구성</span></dd></dl></dialog>
</main><script src="app.js?v=design-2"></script></body></html>
